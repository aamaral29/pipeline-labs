name: "Estrutura de diretórios e Arquivos"

on: 
  push:
    branches: [main]  
  workflow_dispatch:

env:
  NODE_VERSION: "18"

jobs:
  demostrando-estrutura:
    name: 'Demonstrando Estrutura Básica'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Códig
        uses: actions/checkout@v4

      - name: Mostrar estrutura .github/workflows
        run: |
          echo "ESTRUTURA DE DIRETÓRIOS E ARQUIVOS .github/workflows:"
          ls -la .github/workflows
          echo ""
          echo "Total de workflows: $(ls -1 .github/workflows | wc -l)"

      - name: Elementos obrigatórios do workflow
        run: |
          echo "ELEMENTOS OBRIGATÓRIOS DO WORKFLOW:"
          echo "1. name: Nome do workflow"
          echo "2. on: Eventos que disparam o workflow"
          echo "3. jobs: Conjunto de trabalhos a serem executados"
          echo "4. runs-on: Ambiente de execução do trabalho"
          echo ""
          echo "Total de elementos obrigatórios: 5"

      - name: Variávei de contexto
        run: |
          echo "== VARIÁVEIS DE CONTEXTO =="
          echo "Variável env: ${{ env.NODE_VERSION }}"
          echo "1. ENV: Define variáveis de ambiente"
          echo "2. contextos: Acesso a informação do workflow, job e steps"
          echo ""
          echo "Total de variáveis de contexto: 2"